
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace — Just Travel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#efefec;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9b9b96;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);
  --purple:#7F77DD;--purple-l:#EEEDFE;--purple-d:#3C3489;
  --teal:#1D9E75;--teal-l:#E1F5EE;--teal-d:#085041;
  --amber:#BA7517;--amber-l:#FAEEDA;--amber-d:#633806;
  --red:#E24B4A;--red-l:#FCEBEB;--red-d:#791F1F;
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-d:#0C447C;
  --green-l:#EAF3DE;--green-d:#27500A;
  --gray-l:#F1EFE8;--gray-m:#888780;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
  --text:#f0f0ec;--text2:#a0a09a;--text3:#6b6b65;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18);
  --purple-l:#2a2860;--purple-d:#b8b4f0;
  --teal-l:#0a2e22;--teal-d:#5fd4a8;
  --amber-l:#2e2008;--amber-d:#f5c060;
  --red-l:#2e1010;--red-d:#f08080;
  --blue-l:#0a1e35;--blue-d:#7ab8f5;
  --green-l:#0f2008;--green-d:#90c850;
  --gray-l:#252523}}
body{font-family:var(--font);background:var(--bg3);color:var(--text);min-height:100vh}

/* ACESSO NEGADO */
.blocked{min-height:100vh;display:flex;align-items:center;justify-content:center}
.blocked-card{background:var(--bg);border-radius:20px;padding:3rem 2rem;width:340px;max-width:95vw;border:.5px solid var(--border);text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.blocked-card i{font-size:40px;color:var(--red);display:block;margin-bottom:1rem}
.blocked-card h2{font-size:18px;font-weight:600;margin-bottom:8px}
.blocked-card p{font-size:13px;color:var(--text2);line-height:1.5}

/* APP */
.app{max-width:760px;margin:0 auto;padding:2rem 1rem 4rem}
.header{display:flex;align-items:center;gap:14px;margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:.5px solid var(--border)}
.header-icon{width:40px;height:40px;background:var(--purple-l);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header h1{font-size:20px;font-weight:600}
.header-date{font-size:13px;color:var(--text2);margin-top:2px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.sync-status{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--gray-m)}
.sync-dot.ok{background:var(--teal)}.sync-dot.saving{background:var(--amber);animation:pulse 1s infinite}.sync-dot.err{background:var(--red)}
.user-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--purple-l);border-radius:20px;font-size:12px;color:var(--purple-d);font-weight:500}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}

.nav{display:flex;gap:4px;margin-bottom:1.75rem;background:var(--bg2);padding:4px;border-radius:12px}
.nav-btn{flex:1;padding:9px 6px;font-size:12px;font-weight:500;border:none;background:none;border-radius:9px;cursor:pointer;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--font);position:relative}
.nav-btn.active{background:var(--bg);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.nav-btn i{font-size:15px}
.nav-badge{position:absolute;top:3px;right:6px;min-width:16px;height:16px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}

.loading-screen{text-align:center;padding:4rem 1rem;color:var(--text2)}
.loading-screen i{font-size:32px;display:block;margin-bottom:12px;color:var(--purple);animation:spin 1s linear infinite}
.section{display:none}.section.active{display:block}
.tabs{display:flex;margin-bottom:1.5rem;border-bottom:.5px solid var(--border)}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-left:none;border-right:none;border-top:none;font-family:var(--font);transition:all .15s}
.tab.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:500}
.add-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1.25rem;font-family:var(--font);transition:opacity .15s}
.add-btn:hover{opacity:.88}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border-radius:16px;padding:1.75rem;width:500px;max-width:100%;border:.5px solid var(--border);max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;font-weight:600;margin-bottom:1.5rem}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea{width:100%;padding:9px 11px;font-size:14px;border:.5px solid var(--border2);border-radius:8px;background:var(--bg2);color:var(--text);font-family:var(--font)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--purple)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.type-btns,.prio-btns{display:flex;gap:8px;flex-wrap:wrap}
.type-btn,.prio-btn{padding:7px 14px;font-size:12px;border-radius:20px;border:.5px solid var(--border2);cursor:pointer;background:none;color:var(--text2);font-family:var(--font);transition:all .15s;display:flex;align-items:center;gap:5px}
.prio-btn{flex:1;justify-content:center;border-radius:8px}
.type-btn.sel-info{background:var(--blue-l);color:var(--blue-d);border-color:transparent}
.type-btn.sel-warn{background:var(--amber-l);color:var(--amber-d);border-color:transparent}
.type-btn.sel-danger{background:var(--red-l);color:var(--red-d);border-color:transparent}
.prio-btn.sel-alta{background:var(--red-l);color:var(--red-d);border-color:transparent}
.prio-btn.sel-media{background:var(--amber-l);color:var(--amber-d);border-color:transparent}
.prio-btn.sel-baixa{background:var(--green-l);color:var(--green-d);border-color:transparent}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1rem;border-top:.5px solid var(--border)}
.btn-cancel{padding:9px 18px;border:.5px solid var(--border2);background:none;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text2);font-family:var(--font)}
.btn-save{padding:9px 18px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font)}
.btn-save:disabled{opacity:.5;cursor:default}

.card{background:var(--bg);border:.5px solid var(--border);border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:10px;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.07)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-title{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4}
.card-desc{font-size:13px;color:var(--text2);line-height:1.55}
.card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.b-info{background:var(--blue-l);color:var(--blue-d)}.b-warn{background:var(--amber-l);color:var(--amber-d)}.b-danger{background:var(--red-l);color:var(--red-d)}.b-success{background:var(--teal-l);color:var(--teal-d)}.b-gray{background:var(--gray-l);color:var(--gray-m)}.b-purple{background:var(--purple-l);color:var(--purple-d)}.b-green{background:var(--green-l);color:var(--green-d)}
.resolve-btn{padding:5px 11px;font-size:12px;border:.5px solid var(--teal);color:var(--teal);border-radius:6px;background:none;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:4px}
.resolve-btn:hover{background:var(--teal-l)}
.reopen-btn{padding:5px 11px;font-size:12px;border:.5px solid var(--border2);color:var(--text2);border-radius:6px;background:none;cursor:pointer;font-family:var(--font)}
.status-row{margin-top:12px;padding-top:12px;border-top:.5px solid var(--border)}
.status-pills{display:flex;gap:4px;flex-wrap:wrap}
.status-pill{padding:5px 11px;font-size:11px;border-radius:20px;border:.5px solid var(--border);cursor:pointer;background:none;color:var(--text2);font-family:var(--font);transition:all .12s}
.sp-not{background:var(--gray-l);color:#5F5E5A;border-color:transparent}.sp-wip{background:var(--blue-l);color:var(--blue-d);border-color:transparent}.sp-block{background:var(--red-l);color:var(--red-d);border-color:transparent}.sp-done{background:var(--teal-l);color:var(--teal-d);border-color:transparent}
.update-row{margin-top:10px;display:flex;gap:8px;align-items:center}
.date-input{width:138px;padding:7px 9px;font-size:12px;border:.5px solid var(--border2);border-radius:8px;background:var(--bg2);color:var(--text);font-family:var(--font);flex-shrink:0}
.note-input{flex:1;padding:7px 10px;font-size:13px;border:.5px solid var(--border2);border-radius:8px;background:var(--bg2);color:var(--text);font-family:var(--font)}
.note-input:focus,.date-input:focus{outline:none;border-color:var(--purple)}
.send-btn{padding:7px 13px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;flex-shrink:0}
.last-note{font-size:11px;color:var(--text2);margin-top:7px;padding:6px 10px;background:var(--bg2);border-radius:7px;line-height:1.45}
.history-btn{font-size:11px;color:var(--purple);cursor:pointer;background:none;border:none;padding:0;margin-top:8px;font-family:var(--font);display:inline-flex;align-items:center;gap:4px}
.history-list{display:none;margin-top:10px}.history-list.open{display:block}
.history-item{padding:8px 10px;background:var(--bg2);border-radius:8px;margin-bottom:5px;font-size:12px}
.hi-top{display:flex;justify-content:space-between;margin-bottom:2px}
.hi-status{font-weight:500}.hi-date{color:var(--text3);font-size:11px}.hi-note{color:var(--text2);line-height:1.4}
.deadline-warn{color:var(--amber);display:flex;align-items:center;gap:3px}.deadline-late{color:var(--red);display:flex;align-items:center;gap:3px}.deadline-ok{color:var(--text2);display:flex;align-items:center;gap:3px}
.count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;background:var(--purple-l);color:var(--purple-d);border-radius:10px;font-size:11px;font-weight:600;margin-left:5px;padding:0 4px}
.empty{text-align:center;padding:3.5rem 1rem;color:var(--text3);font-size:14px}
.empty i{font-size:36px;display:block;margin-bottom:10px;opacity:.35}

.inbox-card{background:var(--bg);border:1.5px solid var(--purple);border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:10px}
.inbox-from{font-size:11px;color:var(--purple-d);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.accept-btn{padding:5px 12px;font-size:12px;background:var(--purple);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:4px}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.75rem}
.metric-card{background:var(--bg2);border-radius:12px;padding:14px 16px}
.m-label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.m-value{font-size:30px;font-weight:600;line-height:1}
.m-sub{font-size:11px;color:var(--text3);margin-top:5px}
.m-purple{color:var(--purple)}.m-teal{color:var(--teal)}.m-amber{color:var(--amber)}.m-red{color:var(--red)}.m-blue{color:var(--blue)}
.dash-block{margin-bottom:1.5rem}
.dash-block-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.divider{border:none;border-top:.5px solid var(--border);margin:1.5rem 0}
.prio-strip{display:flex;gap:10px}
.prio-chip{flex:1;padding:12px 10px;border-radius:10px;text-align:center}
.pc-n{font-size:26px;font-weight:600}.pc-l{font-size:11px;margin-top:3px;font-weight:500}
.pc-alta{background:var(--red-l);color:var(--red-d)}.pc-media{background:var(--amber-l);color:var(--amber-d)}.pc-baixa{background:var(--green-l);color:var(--green-d)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-lbl{font-size:12px;color:var(--text2);width:95px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:8px;background:var(--bg3);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;transition:width .5s ease}
.bar-cnt{font-size:12px;font-weight:500;width:26px;text-align:right;flex-shrink:0}
.tl-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.tl-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0}
.dot-done{background:var(--teal)}.dot-wip{background:var(--blue)}.dot-block{background:var(--red)}.dot-not{background:var(--gray-m)}
.tl-task{font-size:13px;line-height:1.45}.tl-meta{font-size:11px;color:var(--text2);margin-top:2px}
</style>
</head>
<body>

<!-- BLOQUEADO -->
<div id="blocked-screen" class="blocked" style="display:none">
  <div class="blocked-card">
    <i class="ti ti-lock"></i>
    <h2>Acesso não autorizado</h2>
    <p>Este link não é válido.<br>Use o link exclusivo que foi compartilhado com você.</p>
  </div>
</div>

<!-- APP -->
<div id="app-screen" style="display:none">
  <div class="app">
    <div class="header">
      <div class="header-icon"><i class="ti ti-layout-dashboard" style="font-size:20px;color:var(--purple)"></i></div>
      <div>
        <h1>Workspace</h1>
        <div class="header-date" id="header-date"></div>
      </div>
      <div class="header-right">
        <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">—</span></div>
        <div class="user-chip"><i class="ti ti-user" style="font-size:13px"></i><span id="user-name-chip" style="margin-left:4px"></span></div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-btn active" onclick="switchSection('dashboard',this)"><i class="ti ti-chart-bar"></i> Dashboard</button>
      <button class="nav-btn" onclick="switchSection('issues',this)"><i class="ti ti-alert-circle"></i> Issues</button>
      <button class="nav-btn" onclick="switchSection('tasks',this)"><i class="ti ti-checkbox"></i> Tasks</button>
      <button class="nav-btn" onclick="switchSection('inbox',this)"><i class="ti ti-inbox"></i> Demandas<span class="nav-badge" id="inbox-badge" style="display:none">0</span></button>
    </nav>

    <div id="loading-screen" class="loading-screen"><i class="ti ti-loader-2"></i>Carregando...</div>

    <div class="section" id="sec-dashboard">
      <div class="dash-grid" id="dash-metrics"></div>
      <hr class="divider">
      <div class="dash-block"><div class="dash-block-title"><i class="ti ti-flag"></i> Por prioridade</div><div class="prio-strip" id="dash-prio"></div></div>
      <hr class="divider">
      <div class="dash-block"><div class="dash-block-title"><i class="ti ti-list-check"></i> Por status</div><div id="dash-status-bars"></div></div>
      <hr class="divider">
      <div class="dash-block"><div class="dash-block-title"><i class="ti ti-clock"></i> Atividade recente</div><div id="dash-timeline"></div></div>
      <hr class="divider">
      <div class="dash-block"><div class="dash-block-title"><i class="ti ti-alert-circle"></i> Issues</div><div id="dash-issues-bars"></div></div>
    </div>

    <div class="section" id="sec-issues">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('issues','abertas',this)">Abertas <span class="count-badge" id="cnt-abertas">0</span></button>
        <button class="tab" onclick="switchTab('issues','resolvidas',this)">Resolvidas <span class="count-badge" id="cnt-resolvidas">0</span></button>
        <button class="tab" onclick="switchTab('issues','todas-i',this)">Todas</button>
      </div>
      <button class="add-btn" onclick="openModal('issue-modal')"><i class="ti ti-plus"></i> Nova Issue</button>
      <div id="issues-list"></div>
    </div>

    <div class="section" id="sec-tasks">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('tasks','ativas',this)">Ativas <span class="count-badge" id="cnt-ativas">0</span></button>
        <button class="tab" onclick="switchTab('tasks','concluidas',this)">Concluídas <span class="count-badge" id="cnt-concluidas">0</span></button>
        <button class="tab" onclick="switchTab('tasks','todas-t',this)">Todas</button>
      </div>
      <button class="add-btn" onclick="openModal('task-modal')"><i class="ti ti-plus"></i> Nova Task</button>
      <div id="tasks-list"></div>
    </div>

    <div class="section" id="sec-inbox">
      <button class="add-btn" onclick="openModal('demand-modal')"><i class="ti ti-send"></i> Enviar demanda para <span id="other-name-btn"></span></button>
      <div id="inbox-list"></div>
    </div>
  </div>
</div>

<!-- MODAIS -->
<div class="modal-bg" id="issue-modal">
  <div class="modal">
    <h2>Nova Issue</h2>
    <div class="field"><label>Título</label><input type="text" id="i-title" placeholder="Título curto e direto"></div>
    <div class="field"><label>Tipo</label>
      <div class="type-btns">
        <button class="type-btn" onclick="selectType(this,'info')"><i class="ti ti-info-circle"></i> Informação</button>
        <button class="type-btn" onclick="selectType(this,'discussion')"><i class="ti ti-messages"></i> Discussão</button>
        <button class="type-btn" onclick="selectType(this,'decision')"><i class="ti ti-gavel"></i> Decisão</button>
      </div>
    </div>
    <div class="field"><label>Descrição</label><textarea id="i-desc" placeholder="Detalhe o contexto..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
      <button class="btn-save" id="btn-si" onclick="saveIssue()">Salvar Issue</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="task-modal">
  <div class="modal">
    <h2>Nova Task</h2>
    <div class="field"><label>Descrição</label><textarea id="t-desc" placeholder="O que precisa ser feito?"></textarea></div>
    <div class="field"><label>Prioridade</label>
      <div class="prio-btns" id="t-prio-btns">
        <button class="prio-btn" onclick="selectPrio('t',this,'alta')"><i class="ti ti-arrow-up"></i> Alta</button>
        <button class="prio-btn" onclick="selectPrio('t',this,'media')"><i class="ti ti-minus"></i> Média</button>
        <button class="prio-btn" onclick="selectPrio('t',this,'baixa')"><i class="ti ti-arrow-down"></i> Baixa</button>
      </div>
    </div>
    <div class="field"><label>Dono (e-mail)</label><input type="email" id="t-owner" placeholder="email@dominio.com"></div>
    <div class="field"><label>Deadline</label><input type="date" id="t-deadline"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
      <button class="btn-save" id="btn-st" onclick="saveTask()">Salvar Task</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="demand-modal">
  <div class="modal">
    <h2>Enviar demanda para <span id="demand-target-name"></span></h2>
    <div class="field"><label>Descrição</label><textarea id="d-desc" placeholder="O que você precisa que ela faça?"></textarea></div>
    <div class="field"><label>Prioridade</label>
      <div class="prio-btns" id="d-prio-btns">
        <button class="prio-btn" onclick="selectPrio('d',this,'alta')"><i class="ti ti-arrow-up"></i> Alta</button>
        <button class="prio-btn" onclick="selectPrio('d',this,'media')"><i class="ti ti-minus"></i> Média</button>
        <button class="prio-btn" onclick="selectPrio('d',this,'baixa')"><i class="ti ti-arrow-down"></i> Baixa</button>
      </div>
    </div>
    <div class="field"><label>Deadline</label><input type="date" id="d-deadline"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
      <button class="btn-save" id="btn-sd" onclick="sendDemand()">Enviar demanda</button>
    </div>
  </div>
</div>

<script>
// ================================================================
// TOKENS SECRETOS — cada usuária tem seu link exclusivo
// Beca:  https://rebecadecarvalhobarbosa.github.io/notebook/?u=beca-jt2024xk9
// Tainá: https://rebecadecarvalhobarbosa.github.io/notebook/?u=taina-jt2024mp7
// ================================================================
const TOKENS = {
  'beca-jt2024xk9':  { user: 'beca',  name: 'Rebeca' },
  'taina-jt2024mp7': { user: 'taina', name: 'Tainá'  }
};
const OTHER = { beca: 'taina', taina: 'beca' };
const NAMES = { beca: 'Rebeca', taina: 'Tainá' };
const SN = {'nao-iniciada':'Não iniciada','em-curso':'Em curso','bloqueada':'Bloqueada','concluida':'Concluída'};
const API = 'https://script.google.com/macros/s/AKfycbzrZoTzHUMYQge7wLQ6G2DdHFLJxeJn7X5c8T6y8MhbY8VQh39pBD_SGjtSClpGaRhcIQ/exec';
const TODAY = new Date().toISOString().split('T')[0];

let me = null, myName = '';
let issueTab='abertas', taskTab='ativas', selType='', selTP='', selDP='';
let issues=[], tasks=[], inbox=[];

document.getElementById('header-date').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

// ---- AUTENTICAÇÃO POR TOKEN NA URL ----
function init() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('u');
  const profile = TOKENS[token];
  if (!profile) {
    document.getElementById('blocked-screen').style.display = 'flex';
    return;
  }
  me = profile.user;
  myName = profile.name;
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('user-name-chip').textContent = myName;
  document.getElementById('other-name-btn').textContent = NAMES[OTHER[me]];
  document.getElementById('demand-target-name').textContent = NAMES[OTHER[me]];
  loadData();
}

// ---- API ----
function setSyncStatus(state, label) {
  document.getElementById('sync-dot').className = 'sync-dot' + (state ? ' '+state : '');
  document.getElementById('sync-label').textContent = label;
}

async function apiGet(params) {
  const p = new URLSearchParams({...params, user: me});
  const res = await fetch(API + '?' + p, {redirect:'follow'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Erro desconhecido');
  return json.data;
}

async function apiPost(body) {
  const res = await fetch(API, {method:'POST', body: JSON.stringify({...body, user: me}), redirect:'follow'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Erro desconhecido');
  return json.data;
}

async function loadData() {
  setSyncStatus('saving', 'Carregando...');
  document.getElementById('loading-screen').style.display = 'block';
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  try {
    [issues, tasks, inbox] = await Promise.all([
      apiGet({action:'read', sheet:'issues'}),
      apiGet({action:'read', sheet:'tasks'}),
      apiGet({action:'read', sheet:'inbox'})
    ]);
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('sec-dashboard').classList.add('active');
    setSyncStatus('ok', 'Sincronizado');
    renderAll();
  } catch(e) {
    setSyncStatus('err', 'Erro');
    document.getElementById('loading-screen').innerHTML = `
      <i class="ti ti-wifi-off" style="animation:none;color:var(--red)"></i>
      <div style="margin-bottom:8px;font-weight:500">Não foi possível conectar.</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:16px">${e.message}</div>
      <button onclick="loadData()" style="padding:8px 18px;background:var(--purple);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--font)">Tentar novamente</button>`;
  }
}

async function persist() {
  setSyncStatus('saving', 'Salvando...');
  try {
    await Promise.all([
      apiPost({action:'write', sheet:'issues', data:issues}),
      apiPost({action:'write', sheet:'tasks',  data:tasks})
    ]);
    setSyncStatus('ok', 'Sincronizado');
  } catch(e) { setSyncStatus('err', 'Erro: ' + e.message); }
}

// ---- NAV ----
function switchSection(s, btn) {
  document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
  document.getElementById('sec-'+s).classList.add('active');
  btn.classList.add('active');
  if (s === 'dashboard') renderDashboard();
}
function switchTab(sec, tab, el) {
  if (sec === 'issues') issueTab = tab; else taskTab = tab;
  el.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

// ---- MODAIS ----
function openModal(id) {
  if(id==='issue-modal'){selType='';document.getElementById('i-title').value='';document.getElementById('i-desc').value='';document.querySelectorAll('.type-btn').forEach(b=>b.className='type-btn');}
  if(id==='task-modal'){selTP='';document.getElementById('t-desc').value='';document.getElementById('t-owner').value='';document.getElementById('t-deadline').value='';document.querySelectorAll('#t-prio-btns .prio-btn').forEach(b=>b.className='prio-btn');}
  if(id==='demand-modal'){selDP='';document.getElementById('d-desc').value='';document.getElementById('d-deadline').value='';document.querySelectorAll('#d-prio-btns .prio-btn').forEach(b=>b.className='prio-btn');}
  document.getElementById(id).classList.add('open');
}
function closeModals() { document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('open')); }
document.querySelectorAll('.modal-bg').forEach(bg => bg.addEventListener('click', e => { if(e.target===bg) closeModals(); }));

function selectType(btn, t) {
  selType = t;
  document.querySelectorAll('.type-btn').forEach(b => b.className='type-btn');
  btn.className = 'type-btn '+(t==='info'?'sel-info':t==='discussion'?'sel-warn':'sel-danger');
}
function selectPrio(prefix, btn, p) {
  if(prefix==='t') selTP=p; else selDP=p;
  document.querySelectorAll('#'+prefix+'-prio-btns .prio-btn').forEach(b => b.className='prio-btn');
  btn.className = 'prio-btn sel-'+p;
}

// ---- SALVAR ----
async function saveIssue() {
  const title = document.getElementById('i-title').value.trim();
  const desc  = document.getElementById('i-desc').value.trim();
  if(!title){alert('Adicione um título');return;}
  if(!selType){alert('Selecione o tipo');return;}
  const btn = document.getElementById('btn-si');
  btn.disabled=true; btn.textContent='Salvando...';
  issues.unshift({id:Date.now().toString(),title,desc,type:selType,status:'aberta',createdAt:new Date().toISOString()});
  await persist();
  btn.disabled=false; btn.textContent='Salvar Issue';
  closeModals(); renderAll();
}

async function saveTask() {
  const desc     = document.getElementById('t-desc').value.trim();
  const owner    = document.getElementById('t-owner').value.trim();
  const deadline = document.getElementById('t-deadline').value;
  if(!desc){alert('Adicione uma descrição');return;}
  if(!selTP){alert('Selecione a prioridade');return;}
  const btn = document.getElementById('btn-st');
  btn.disabled=true; btn.textContent='Salvando...';
  tasks.unshift({id:Date.now().toString(),desc,owner,deadline,priority:selTP,status:'nao-iniciada',history:[],createdAt:new Date().toISOString()});
  await persist();
  btn.disabled=false; btn.textContent='Salvar Task';
  closeModals(); renderAll();
}

async function sendDemand() {
  const desc     = document.getElementById('d-desc').value.trim();
  const deadline = document.getElementById('d-deadline').value;
  if(!desc){alert('Descreva a demanda');return;}
  if(!selDP){alert('Selecione a prioridade');return;}
  const btn = document.getElementById('btn-sd');
  btn.disabled=true; btn.textContent='Enviando...';
  try {
    await apiPost({action:'send_demand', target:OTHER[me], task:{desc,priority:selDP,deadline}});
    btn.disabled=false; btn.textContent='Enviar demanda';
    closeModals();
    alert('Demanda enviada para '+NAMES[OTHER[me]]+'!');
  } catch(e) {
    btn.disabled=false; btn.textContent='Enviar demanda';
    alert('Erro: '+e.message);
  }
}

async function acceptInbox(taskId) {
  setSyncStatus('saving','Aceitando...');
  try { await apiPost({action:'accept_inbox', taskId}); await loadData(); }
  catch(e) { setSyncStatus('err','Erro: '+e.message); }
}

async function resolveIssue(id){const i=issues.find(x=>x.id===id);if(i){i.status='resolvida';await persist();renderAll();}}
async function reopenIssue(id){const i=issues.find(x=>x.id===id);if(i){i.status='aberta';await persist();renderAll();}}

async function setStatus(id, status) {
  const task = tasks.find(t=>t.id===id); if(!task) return;
  task.status = status;
  const date = document.getElementById('ud-'+id)?.value || TODAY;
  const note = (document.getElementById('un-'+id)?.value||'').trim();
  task.history.push({status,date,note,at:new Date().toISOString()});
  const ni = document.getElementById('un-'+id); if(ni) ni.value='';
  await persist(); renderAll();
}

async function addUpdate(id) {
  const task = tasks.find(t=>t.id===id); if(!task) return;
  const note = (document.getElementById('un-'+id)?.value||'').trim();
  if(!note){alert('Escreva uma observação');return;}
  const date = document.getElementById('ud-'+id)?.value || TODAY;
  task.history.push({status:task.status,date,note,at:new Date().toISOString()});
  document.getElementById('un-'+id).value='';
  await persist(); renderAll();
  setTimeout(()=>{const h=document.getElementById('hist-'+id);if(h)h.classList.add('open');},50);
}

function toggleHistory(id){const el=document.getElementById('hist-'+id);if(el)el.classList.toggle('open');}

// ---- RENDER ----
function renderAll(){renderIssues();renderTasks();renderInbox();updateCounts();renderDashboard();}

function updateCounts(){
  document.getElementById('cnt-abertas').textContent=issues.filter(i=>i.status==='aberta').length;
  document.getElementById('cnt-resolvidas').textContent=issues.filter(i=>i.status==='resolvida').length;
  document.getElementById('cnt-ativas').textContent=tasks.filter(t=>t.status!=='concluida').length;
  document.getElementById('cnt-concluidas').textContent=tasks.filter(t=>t.status==='concluida').length;
  const n=inbox.filter(i=>!i.accepted).length;
  const b=document.getElementById('inbox-badge');
  b.style.display=n>0?'flex':'none'; b.textContent=n;
}

function renderInbox(){
  const el=document.getElementById('inbox-list');
  const pending=inbox.filter(i=>!i.accepted);
  if(!pending.length){el.innerHTML='<div class="empty"><i class="ti ti-inbox"></i>Nenhuma demanda pendente</div>';return;}
  el.innerHTML=pending.map(item=>`
    <div class="inbox-card">
      <div class="inbox-from"><i class="ti ti-send"></i> Demanda de <strong>${esc(item.fromName||item.from)}</strong></div>
      <div style="font-size:14px;color:var(--text);line-height:1.55;margin-bottom:12px">${esc(item.desc)}</div>
      <div class="card-meta">
        ${prioLabel(item.priority)}
        ${item.deadline?`<span style="font-size:12px">${dlLabel(item.deadline)}</span>`:''}
        <span style="font-size:11px;color:var(--text3);margin-left:auto">${fmtDate(item.receivedAt)}</span>
        <button class="accept-btn" onclick="acceptInbox('${item.id}')"><i class="ti ti-check"></i> Aceitar como task</button>
      </div>
    </div>`).join('');
}

function dlLabel(dl){
  if(!dl)return'';
  const t=new Date();t.setHours(0,0,0,0);
  const d=new Date(dl+'T00:00:00');
  const diff=Math.round((d-t)/86400000);
  if(diff<0)return`<span class="deadline-late"><i class="ti ti-alert-triangle"></i> ${dl} (atrasada)</span>`;
  if(diff===0)return`<span class="deadline-warn"><i class="ti ti-clock"></i> ${dl} (hoje!)</span>`;
  if(diff<=3)return`<span class="deadline-warn"><i class="ti ti-clock"></i> ${dl} (+${diff}d)</span>`;
  return`<span class="deadline-ok"><i class="ti ti-calendar"></i> ${dl}</span>`;
}
function typeLabel(t){
  if(t==='info')return'<span class="badge b-info"><i class="ti ti-info-circle"></i> Informação</span>';
  if(t==='discussion')return'<span class="badge b-warn"><i class="ti ti-messages"></i> Discussão</span>';
  if(t==='decision')return'<span class="badge b-danger"><i class="ti ti-gavel"></i> Decisão</span>';
  return'';
}
function statusLabel(s){
  const m={'nao-iniciada':['b-gray','Não iniciada'],'em-curso':['b-info','Em curso'],'bloqueada':['b-danger','Bloqueada'],'concluida':['b-success','Concluída']};
  const[c,l]=m[s]||['b-gray',s];return`<span class="badge ${c}">${l}</span>`;
}
function prioLabel(p){
  if(!p)return'';
  const m={alta:['b-danger','<i class="ti ti-arrow-up"></i> Alta'],media:['b-warn','<i class="ti ti-minus"></i> Média'],baixa:['b-green','<i class="ti ti-arrow-down"></i> Baixa']};
  const[c,l]=m[p]||['b-gray',p];return`<span class="badge ${c}">${l}</span>`;
}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function fmtDate(iso){return iso?new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):''}

function renderIssues(){
  let f=issues;
  if(issueTab==='abertas')f=issues.filter(i=>i.status==='aberta');
  else if(issueTab==='resolvidas')f=issues.filter(i=>i.status==='resolvida');
  const el=document.getElementById('issues-list');
  if(!f.length){el.innerHTML=`<div class="empty"><i class="ti ti-inbox"></i>${issueTab==='abertas'?'Nenhuma issue aberta':issueTab==='resolvidas'?'Nenhuma issue resolvida':'Nenhuma issue'}</div>`;return;}
  el.innerHTML=f.map(iss=>`
    <div class="card">
      <div class="card-header">
        <div style="flex:1"><div class="card-title">${esc(iss.title)}</div>${iss.desc?`<div class="card-desc">${esc(iss.desc)}</div>`:''}</div>
        <div>${iss.status==='aberta'?`<button class="resolve-btn" onclick="resolveIssue('${iss.id}')"><i class="ti ti-check"></i> Resolver</button>`:`<button class="reopen-btn" onclick="reopenIssue('${iss.id}')">Reabrir</button>`}</div>
      </div>
      <div class="card-meta">${typeLabel(iss.type)}<span class="badge ${iss.status==='aberta'?'b-purple':'b-success'}">${iss.status==='aberta'?'Aberta':'Resolvida'}</span><span style="font-size:11px;color:var(--text3);margin-left:auto">${fmtDate(iss.createdAt)}</span></div>
    </div>`).join('');
}

function renderTasks(){
  let f=tasks;
  if(taskTab==='ativas')f=tasks.filter(t=>t.status!=='concluida');
  else if(taskTab==='concluidas')f=tasks.filter(t=>t.status==='concluida');
  const el=document.getElementById('tasks-list');
  if(!f.length){el.innerHTML=`<div class="empty"><i class="ti ti-checkbox"></i>${taskTab==='ativas'?'Nenhuma task ativa':taskTab==='concluidas'?'Nenhuma task concluída':'Nenhuma task'}</div>`;return;}
  el.innerHTML=f.map(task=>{
    const hist=task.history||[];
    const ln=hist.length?hist[hist.length-1]:null;
    const spMap={'nao-iniciada':'sp-not','em-curso':'sp-wip','bloqueada':'sp-block','concluida':'sp-done'};
    return`<div class="card">
      <div class="card-header">
        <div style="flex:1"><div class="card-desc" style="font-size:14px;color:var(--text);line-height:1.55">${esc(task.desc)}</div></div>
        <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">${prioLabel(task.priority)}${statusLabel(task.status)}</div>
      </div>
      <div class="card-meta" style="gap:14px">
        ${task.owner?`<span style="font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px"><i class="ti ti-user"></i> ${esc(task.owner)}</span>`:''}
        ${task.deadline?`<span style="font-size:12px">${dlLabel(task.deadline)}</span>`:''}
        <span style="font-size:11px;color:var(--text3);margin-left:auto">${fmtDate(task.createdAt)}</span>
      </div>
      <div class="status-row"><div class="status-pills">
        ${['nao-iniciada','em-curso','bloqueada','concluida'].map(s=>`<button class="status-pill${task.status===s?' '+spMap[s]:''}" onclick="setStatus('${task.id}','${s}')">${SN[s]}</button>`).join('')}
      </div></div>
      <div class="update-row">
        <input type="date" id="ud-${task.id}" class="date-input" value="${TODAY}">
        <input type="text" id="un-${task.id}" class="note-input" placeholder="Adicionar observação...">
        <button class="send-btn" onclick="addUpdate('${task.id}')"><i class="ti ti-send"></i></button>
      </div>
      ${ln?`<div class="last-note">${esc(ln.note.length>90?ln.note.slice(0,90)+'…':ln.note)} <span style="opacity:.6">· ${ln.date}</span></div>`:''}
      ${hist.length?`<button class="history-btn" onclick="toggleHistory('${task.id}')"><i class="ti ti-history"></i> Ver histórico (${hist.length})</button>`:''}
      <div class="history-list" id="hist-${task.id}">
        ${[...hist].reverse().map(h=>`<div class="history-item"><div class="hi-top"><span class="hi-status">${SN[h.status]||h.status}</span><span class="hi-date">${h.date}</span></div>${h.note?`<div class="hi-note">${esc(h.note)}</div>`:''}</div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderDashboard(){
  const total=tasks.length,done=tasks.filter(t=>t.status==='concluida').length,wip=tasks.filter(t=>t.status==='em-curso').length,blocked=tasks.filter(t=>t.status==='bloqueada').length,notS=tasks.filter(t=>t.status==='nao-iniciada').length;
  const pct=total>0?Math.round(done/total*100):0;
  const now=new Date();now.setHours(0,0,0,0);
  const late=tasks.filter(x=>x.deadline&&x.status!=='concluida'&&new Date(x.deadline+'T00:00:00')<now).length;
  const issA=issues.filter(i=>i.status==='aberta').length;
  const pend=inbox.filter(i=>!i.accepted).length;
  document.getElementById('dash-metrics').innerHTML=`
    <div class="metric-card"><div class="m-label">Tasks totais</div><div class="m-value m-purple">${total}</div><div class="m-sub">${done} concluídas</div></div>
    <div class="metric-card"><div class="m-label">Conclusão</div><div class="m-value m-teal">${pct}%</div><div class="m-sub">do total</div></div>
    <div class="metric-card"><div class="m-label">Em curso</div><div class="m-value m-blue">${wip}</div><div class="m-sub">ativas agora</div></div>
    <div class="metric-card"><div class="m-label">Atrasadas</div><div class="m-value ${late>0?'m-red':'m-teal'}">${late}</div><div class="m-sub">deadline vencida</div></div>
    <div class="metric-card"><div class="m-label">Demandas</div><div class="m-value ${pend>0?'m-amber':'m-teal'}">${pend}</div><div class="m-sub">aguardando aceite</div></div>`;
  document.getElementById('dash-prio').innerHTML=`
    <div class="prio-chip pc-alta"><div class="pc-n">${tasks.filter(t=>t.priority==='alta').length}</div><div class="pc-l"><i class="ti ti-arrow-up"></i> Alta</div></div>
    <div class="prio-chip pc-media"><div class="pc-n">${tasks.filter(t=>t.priority==='media').length}</div><div class="pc-l"><i class="ti ti-minus"></i> Média</div></div>
    <div class="prio-chip pc-baixa"><div class="pc-n">${tasks.filter(t=>t.priority==='baixa').length}</div><div class="pc-l"><i class="ti ti-arrow-down"></i> Baixa</div></div>`;
  const mx=Math.max(done,wip,blocked,notS,1);
  document.getElementById('dash-status-bars').innerHTML=[
    {l:'Concluída',c:done,col:'var(--teal)'},{l:'Em curso',c:wip,col:'var(--blue)'},
    {l:'Bloqueada',c:blocked,col:'var(--red)'},{l:'Não iniciada',c:notS,col:'var(--gray-m)'}
  ].map(({l,c,col})=>`<div class="bar-row"><span class="bar-lbl">${l}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/mx*100)}%;background:${col}"></div></div><span class="bar-cnt" style="color:${col}">${c}</span></div>`).join('');
  const evts=[];
  tasks.forEach(t=>{
    if(t.history&&t.history.length)t.history.forEach(h=>evts.push({desc:t.desc,status:h.status,note:h.note,date:h.date,at:h.at}));
    else evts.push({desc:t.desc,status:t.status,note:'',date:(t.createdAt||'').split('T')[0],at:t.createdAt});
  });
  evts.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const dc={'concluida':'dot-done','em-curso':'dot-wip','bloqueada':'dot-block','nao-iniciada':'dot-not'};
  document.getElementById('dash-timeline').innerHTML=evts.slice(0,8).length
    ?evts.slice(0,8).map(e=>`<div class="tl-item"><div class="tl-dot ${dc[e.status]||'dot-not'}"></div><div><div class="tl-task">${esc(e.desc.length>65?e.desc.slice(0,65)+'…':e.desc)}</div><div class="tl-meta">${SN[e.status]||e.status}${e.note?' · '+esc(e.note.length>45?e.note.slice(0,45)+'…':e.note):''} <span style="opacity:.6">· ${e.date}</span></div></div></div>`).join('')
    :'<div style="font-size:13px;color:var(--text3)">Nenhuma atividade ainda.</div>';
  const mxI=Math.max(issA,issues.filter(i=>i.status==='resolvida').length,1);
  document.getElementById('dash-issues-bars').innerHTML=[
    {l:'Abertas',c:issA,col:'var(--purple)'},{l:'Resolvidas',c:issues.filter(i=>i.status==='resolvida').length,col:'var(--teal)'}
  ].map(({l,c,col})=>`<div class="bar-row"><span class="bar-lbl">${l}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/mxI*100)}%;background:${col}"></div></div><span class="bar-cnt" style="color:${col}">${c}</span></div>`).join('');
}

init();
</script>
</body>
</html>
